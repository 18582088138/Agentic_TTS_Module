<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic TTS · 真实 API Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1419; color: #e6e6e6;
    padding: 16px; max-width: 720px; margin: 0 auto;
    line-height: 1.5;
  }
  h1 { font-size: 20px; color: #4ec9b0; margin-bottom: 4px; }
  h2 { font-size: 15px; margin: 16px 0 8px; color: #9cdcfe;
       border-bottom: 1px solid #2d3139; padding-bottom: 4px; }
  .meta { font-size: 12px; color: #8b949e; margin-bottom: 16px; }
  .card {
    background: #161b22; border: 1px solid #2d3139; border-radius: 6px;
    padding: 12px; margin-bottom: 12px;
  }
  label { display: block; font-size: 12px; color: #8b949e; margin: 8px 0 4px; }
  input, select, textarea {
    width: 100%; background: #0d1117; border: 1px solid #2d3139;
    color: #e6e6e6; padding: 8px 10px; border-radius: 4px;
    font-family: inherit; font-size: 13px;
  }
  textarea { min-height: 70px; resize: vertical; }
  button {
    background: #238636; color: white; border: none; padding: 8px 14px;
    border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #444; cursor: not-allowed; }
  button.secondary { background: #30363d; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 0; }
  .toggle { display: flex; gap: 6px; margin: 8px 0; }
  .toggle button { flex: 1; background: #21262d; padding: 8px 4px; }
  .toggle button.active { background: #1f6feb; }
  .status { padding: 10px 12px; border-radius: 4px; margin: 8px 0; font-size: 12px; }
  .status.idle { background: #161b22; color: #8b949e; }
  .status.work { background: #1e3a5c; color: #6cb6ff; }
  .status.ok { background: #1e5c3a; color: #6cf0a8; }
  .status.err { background: #5c1e1e; color: #f06c6c; }
  audio { width: 100%; margin-top: 8px; }
  details { background: #0d1117; border: 1px solid #2d3139; border-radius: 4px;
           padding: 8px 12px; margin: 8px 0; }
  details summary { cursor: pointer; font-size: 12px; color: #9cdcfe; }
  pre { font-size: 11px; overflow-x: auto; color: #c9d1d9; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-warn { background: #5c3a1e; color: #f0b95e; }
  .badge-info { background: #1e3a5c; color: #6cb6ff; }
  .badge-ok { background: #1e5c3a; color: #6cf0a8; }
  .badge-err { background: #5c1e1e; color: #f06c6c; }
  .preset { padding: 3px 8px; font-size: 11px; background: #21262d; border-radius: 3px; margin: 2px; }
</style>
</head>
<body>

<h1>🎙️ Agentic TTS · 真实 API Demo <span class="badge badge-info">Live</span></h1>
<div class="meta">
  调真 MiniMax（语音-2.8-turbo）。手机/电脑浏览器直接访问。
  <a href="/api/info" style="color:#6cb6ff;">/api/info</a>
</div>

<!-- ─── 状态 / status ─── -->
<div class="card">
  <div id="server-info" class="meta">加载中...</div>
</div>

<!-- ─── 引擎模式 ─── -->
<h2>① 合成模式</h2>
<div class="card">
  <div class="toggle" id="mode-toggle">
    <button data-mode="custom_voice" class="active">Custom Voice</button>
    <button data-mode="voice_design">Voice Design</button>
    <button data-mode="voice_clone">Voice Clone</button>
  </div>
  <div class="meta" id="mode-desc">Custom Voice = 用内置 speaker 合成</div>
</div>

<!-- ─── 参数 ─── -->
<h2>② 参数</h2>
<div class="card">
  <label>合成文本</label>
  <textarea id="text-input">今天的人工智能资讯</textarea>

  <div class="preset" data-tag=" [laugh]">+ [laugh]</div>
  <div class="preset" data-tag=" [sigh]">+ [sigh]</div>
  <div class="preset" data-tag=" [breath]">+ [breath]</div>
  <div class="preset" data-tag=" [pause:400ms]">+ [pause:400ms]</div>

  <!-- Custom Voice -->
  <div id="fields-custom_voice">
    <label style="margin-top:8px;">Voice (系统音色)</label>
    <select id="speaker-select">
      <option value="male-qn-qingse">male-qn-qingse (清澈男声)</option>
      <option value="male-qn-jingying">male-qn-jingying (精英男声)</option>
      <option value="female-shaonv">female-shaonv (少女女声)</option>
      <option value="female-yujie">female-yujie (御姐女声)</option>
    </select>
  </div>

  <!-- Voice Design -->
  <div id="fields-voice_design" style="display:none;">
    <label style="margin-top:8px;">Instruct (音色描述)</label>
    <input id="design-instruct" value="沉稳的女声，语速平缓，播音腔">
  </div>

  <!-- Voice Clone -->
  <div id="fields-voice_clone" style="display:none;">
    <label style="margin-top:8px;">参考音频</label>
    <input type="file" id="ref-audio" accept="audio/*">
    <div class="meta" id="ref-info">未选</div>
    <label style="margin-top:8px;">Ref Text (ICL 模式必填)</label>
    <input id="ref-text" value="今天的人工智能资讯">
  </div>
</div>

<!-- ─── 触发 ─── -->
<h2>③ 合成</h2>
<div class="card">
  <button id="btn-synth" style="width:100%;">▶ 合成 (调真 MiniMax)</button>
  <div class="status idle" id="status">就绪</div>
</div>

<!-- ─── 结果 ─── -->
<h2>④ 音频</h2>
<div class="card">
  <audio id="audio-player" controls></audio>
  <div class="meta" id="audio-info" style="margin-top:8px;">尚未合成</div>
  <details style="margin-top:8px;">
    <summary>查看 JSON 响应</summary>
    <pre id="json-out"></pre>
  </details>
</div>

<script>
let mode = 'custom_voice';
let refAudioBase64 = null;

async function loadInfo() {
  try {
    const r = await fetch('/api/info');
    const d = await r.json();
    document.getElementById('server-info').innerHTML =
      `endpoint: <b>${d.endpoint}</b> · model: <b>${d.model}</b><br>`
      + `key: <code>${d.key_masked}</code> · 缓存: <b>${d.voice_cache_size}</b> 个 voice_id`;
  } catch (e) {
    document.getElementById('server-info').innerHTML =
      '<span class="badge badge-err">后端连不上</span>';
  }
}
loadInfo();

// Mode 切换
document.querySelectorAll('#mode-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#mode-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    ['custom_voice', 'voice_design', 'voice_clone'].forEach(m => {
      document.getElementById('fields-' + m).style.display = (m === mode) ? 'block' : 'none';
    });
    const descs = {
      custom_voice: 'Custom Voice = 用内置 speaker 合成',
      voice_design: 'Voice Design = 自然语言描述音色',
      voice_clone: 'Voice Clone = 参考音频克隆（必填 ref_audio）',
    };
    document.getElementById('mode-desc').textContent = descs[mode];
  });
});

// 事件标记插入
document.querySelectorAll('[data-tag]').forEach(el => {
  el.addEventListener('click', () => {
    document.getElementById('text-input').value += el.dataset.tag;
  });
});

// ref audio 上传 → base64
document.getElementById('ref-audio').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  refAudioBase64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
  document.getElementById('ref-info').innerHTML =
    `✓ ${f.name} (${(f.size/1024).toFixed(1)}KB)`;
});

document.getElementById('btn-synth').addEventListener('click', async () => {
  const btn = document.getElementById('btn-synth');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status work';
  status.textContent = '调 MiniMax 中...';

  const req = {
    text: document.getElementById('text-input').value.trim(),
    mode: mode,
  };
  if (mode === 'custom_voice') req.speaker = document.getElementById('speaker-select').value;
  if (mode === 'voice_design') req.instruct = document.getElementById('design-instruct').value;
  if (mode === 'voice_clone') {
    if (!refAudioBase64) {
      status.className = 'status err';
      status.textContent = '请先上传参考音频';
      btn.disabled = false;
      return;
    }
    req.ref_audio_base64 = refAudioBase64;
    req.ref_text = document.getElementById('ref-text').value.trim() || null;
  }

  try {
    const r = await fetch('/api/synthesize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(req),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) {
      status.className = 'status err';
      status.textContent = `失败: ${d.detail || JSON.stringify(d).slice(0, 200)}`;
      document.getElementById('json-out').textContent = JSON.stringify(d, null, 2);
      return;
    }

    // 播放音频
    const audioBytes = Uint8Array.from(atob(d.audio_base64), c => c.charCodeAt(0));
    const blob = new Blob([audioBytes], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const player = document.getElementById('audio-player');
    player.src = url;
    player.play().catch(() => {});

    const cacheBadge = d.cache_hit
      ? '<span class="badge badge-info">CACHE HIT</span>'
      : '<span class="badge badge-warn">CACHE MISS</span>';
    document.getElementById('audio-info').innerHTML =
      `${cacheBadge} voice_id=<code>${d.voice_id_used || '-'}</code> · `
      + `${d.audio_size_bytes} bytes · ${d.model}`;
    document.getElementById('json-out').textContent = JSON.stringify(d, null, 2);
    status.className = 'status ok';
    status.textContent = '完成';
  } catch (e) {
    status.className = 'status err';
    status.textContent = `请求失败: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
